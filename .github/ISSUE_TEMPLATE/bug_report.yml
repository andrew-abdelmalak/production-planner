name: Bug report
description: Report a bug in scheduling constraints, optimizer output, CSV/Excel loading, CLI, or GUI.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For security problems, follow SECURITY.md instead of opening a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Smallest CLI command, snippet, or sample factory config that triggers the issue.
      placeholder: |
        uv run production-planner -i examples/small_factory.json --seed 42
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or release
      description: Output of `git rev-parse --short HEAD` or release tag.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and whether PySide6 GUI or headless CLI was used.
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Paste relevant console output.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and confirmed this is not a duplicate.
          required: true
