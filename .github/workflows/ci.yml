name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt offscreen system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libegl1 \
            libxkbcommon0 \
            libdbus-1-3 \
            libfontconfig1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python and dependencies
        run: uv sync --frozen --extra gui

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Run unit and integration tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -v

      - name: CLI smoke checks
        run: |
          uv run production-planner -i examples/water_factory_config.json -o /tmp/water.json --population 30 --generations 20 --seed 42
          uv run production-planner -i templates/factory_template.xlsx -o /tmp/template.xlsx --population 20 --generations 15 --seed 42
