<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="production-planner social preview card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)" />
  <rect x="0" y="0" width="1280" height="6" fill="url(#accentBar)" />

  <!-- Subtle grid background -->
  <g stroke="#334155" stroke-width="1" opacity="0.35">
    <line x1="680" y1="90" x2="680" y2="550" />
    <line x1="800" y1="90" x2="800" y2="550" />
    <line x1="920" y1="90" x2="920" y2="550" />
    <line x1="1040" y1="90" x2="1040" y2="550" />
    <line x1="1160" y1="90" x2="1160" y2="550" />
    <line x1="650" y1="160" x2="1200" y2="160" />
    <line x1="650" y1="260" x2="1200" y2="260" />
    <line x1="650" y1="360" x2="1200" y2="360" />
    <line x1="650" y1="460" x2="1200" y2="460" />
  </g>

  <!-- Right-side stylized Gantt schedule preview -->
  <rect x="650" y="100" width="550" height="440" rx="14" fill="#0b1220" stroke="#334155" stroke-width="2" />
  <text x="678" y="138" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">MULTI-LINE SCHEDULE (GANTT)</text>
  <text x="1080" y="138" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">100% DEMAND</text>

  <!-- Line 1 row -->
  <text x="678" y="210" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600">LINE 1</text>
  <rect x="755" y="184" width="130" height="40" rx="6" fill="#0284c7" />
  <text x="769" y="209" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">330ml</text>
  <rect x="893" y="191" width="18" height="26" rx="3" fill="#f59e0b" />
  <rect x="919" y="184" width="150" height="40" rx="6" fill="#0d9488" />
  <text x="933" y="209" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">600ml Shrink</text>
  <rect x="1077" y="184" width="90" height="40" rx="6" fill="#6366f1" />
  <text x="1089" y="209" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">1.5L</text>

  <!-- Line 2 row -->
  <text x="678" y="310" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600">LINE 2</text>
  <rect x="755" y="284" width="185" height="40" rx="6" fill="#0d9488" />
  <text x="770" y="309" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">600ml High Speed</text>
  <rect x="948" y="291" width="24" height="26" rx="3" fill="#64748b" />
  <rect x="980" y="284" width="187" height="40" rx="6" fill="#6366f1" />
  <text x="996" y="309" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">1.5L Shrink</text>

  <!-- Line 3 row -->
  <text x="678" y="410" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600">LINE 3</text>
  <rect x="755" y="384" width="110" height="40" rx="6" fill="#10b981" />
  <text x="770" y="409" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Gallon</text>
  <!-- Friday off-shift block -->
  <rect x="875" y="384" width="95" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-dasharray="5 4" stroke-width="1.5" />
  <text x="893" y="409" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">OFF-SHIFT</text>
  <rect x="980" y="384" width="187" height="40" rx="6" fill="#10b981" />
  <text x="996" y="409" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Gallon Run 2</text>

  <!-- Legend -->
  <rect x="678" y="476" width="14" height="14" rx="3" fill="#0d9488" />
  <text x="700" y="488" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Production Run</text>
  <rect x="815" y="476" width="14" height="14" rx="3" fill="#f59e0b" />
  <text x="837" y="488" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Changeover</text>
  <rect x="932" y="476" width="14" height="14" rx="3" fill="#64748b" />
  <text x="954" y="488" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">CIP Cleaning</text>
  <rect x="1062" y="476" width="14" height="14" rx="3" fill="#1e293b" stroke="#475569" stroke-dasharray="3 2" />
  <text x="1084" y="488" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Downtime</text>

  <!-- Left typography block -->
  <rect x="72" y="110" width="220" height="34" rx="17" fill="#0ea5e9" fill-opacity="0.16" stroke="#38bdf8" stroke-opacity="0.45" />
  <text x="92" y="132" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">PYTHON 3.11+ · PYSIDE6</text>

  <text x="72" y="218" fill="#f8fafc" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="52" font-weight="800">production-</text>
  <text x="72" y="278" fill="#38bdf8" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="52" font-weight="800">planner</text>

  <text x="72" y="340" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">Multi-line factory scheduling optimizer</text>
  <text x="72" y="372" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">with genetic search and Gantt UI</text>

  <!-- Bottom feature pills -->
  <rect x="72" y="440" width="146" height="40" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="90" y="465" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600">CSV / XLSX</text>

  <rect x="232" y="440" width="166" height="40" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="250" y="465" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600">CLI + Desktop</text>

  <rect x="412" y="440" width="150" height="40" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="430" y="465" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600">Apache-2.0</text>

  <text x="72" y="544" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">github.com/andrew-abdelmalak/production-planner</text>
</svg>
