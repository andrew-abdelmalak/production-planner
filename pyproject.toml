[project]
name = "production-planner"
version = "0.1.0"
description = "Multi-line production scheduling optimizer and PySide6 Gantt planner using a genetic algorithm"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Andrew Abdelmalak" },
]
dependencies = [
    "numpy>=1.26,<3",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.7,<7",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
production-planner = "app.cli:main"
production-planner-gui = "app.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "optimizer", "file_io", "app"]

[tool.uv]
exclude-newer = "14 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
